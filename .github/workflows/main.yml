name: Build Executables

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name Anikoto --icon icon.ico --paths . --collect-all customtkinter --collect-all language_data anikoto/gui.py
          pyinstaller --onefile --name anikoto --icon icon.ico --paths . --collect-all customtkinter --collect-all language_data anikoto/anikoto.py
          copy dist\Anikoto.exe dist\Anikoto-GUI.exe

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: anikoto-windows
          path: |
            dist/Anikoto.exe
            dist/Anikoto-GUI.exe
            dist/anikoto.exe

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build Linux binary with PyInstaller
        run: |
          pyinstaller --onefile --collect-all customtkinter --collect-all language_data --paths . anikoto/anikoto.py

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: anikoto-linux
          path: dist/anikoto

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 8
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build macOS binary with PyInstaller
        run: |
          pyinstaller --onefile --collect-all customtkinter --collect-all language_data --paths . anikoto/anikoto.py

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: anikoto-macos
          path: dist/anikoto

  release:
    needs: [build-windows, build-linux, build-macos]
    if: always() && needs.build-windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare release packages
        run: |
          set -eux
          mkdir -p dist/packages

          # Windows
          if [ -d dist/anikoto-windows ]; then
            cd dist/anikoto-windows
            zip -j ../packages/anikoto-windows.zip *.exe
            cd ../..
          fi

          # Linux
          if [ -d dist/anikoto-linux ]; then
            cd dist/anikoto-linux
            chmod +x * || true
            zip -j ../packages/anikoto-linux.zip *
            cd ../..
          fi

          # macOS
          if [ -d dist/anikoto-macos ]; then
            cd dist/anikoto-macos
            chmod +x * || true
            zip -j ../packages/anikoto-macos.zip *
            cd ../..
          fi

          ls -la dist/packages

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Anikoto v1.0.${{ github.run_number }}"
          make_latest: true
          body: |
            Automated release build of Anikoto.
            
            ### Windows (No Python Needed)
            1. Download `anikoto-windows.zip` below.
            2. Extract the zip file.
            3. Double-click `Anikoto.exe`.
          files: dist/packages/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
