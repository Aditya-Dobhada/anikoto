[project]
name = "anikoto" 
version = "8.3.1"
description = "Download anime from `anikoto.tv` / `anikoto.bz` / `anikoto.net` / `anikoto.cz`"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Aditya-Dobhada"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    'requests',
    'yt-dlp',
    'pycryptodome',
    'bs4',
    'curl_cffi',
    'm3u8',
    'cryptography',
    'langcodes',
    'language-data',
    'customtkinter>=6.0.0',
    'darkdetect'
]

[project.scripts]
anikoto = "anikoto.anikoto:main"
anikoto-gui = "anikoto.gui:run_gui"

[project.urls]
"Homepage" = "https://github.com/Aditya-Dobhada/anikoto"
"Source" = "https://github.com/Aditya-Dobhada/anikoto"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"
